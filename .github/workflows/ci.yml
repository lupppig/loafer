name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Verify generated control-plane contract
        run: uv run python scripts/generate_control_plane_contract.py --check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=loafer --cov-report=term-missing

  control-plane-postgres:
    name: Control Plane PostgreSQL Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loafer
          POSTGRES_PASSWORD: loafer
          POSTGRES_DB: loafer_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loafer -d loafer_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run PostgreSQL metadata and RLS migrations
        env:
          TEST_POSTGRES_URL: postgresql://loafer:loafer@localhost:5432/loafer_dev
        run: uv run pytest tests/integration/test_metadata_store.py -v

  web-auth:
    name: Web & Authentication Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Check production advisories
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and typecheck
        working-directory: web
        run: npm run lint && npm run typecheck

      - name: Verify Better Auth security contracts
        working-directory: web
        run: npm run test:auth

      - name: Build web and BFF routes
        working-directory: web
        run: npm run build

  dependency-audit:
    name: Python Dependency Audit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --output-file "${RUNNER_TEMP}/loafer-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement "${RUNNER_TEMP}/loafer-requirements.txt" \
            --progress-spinner off

  smoke:
    name: Artifact Smoke (clean room)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from tags; full history lets the smoke
          # scripts resolve a real version via `git describe`.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"

      # Build the wheel and install it into a bare python:3.11-slim container —
      # no dev extras, no repo .venv — then run a real pipeline. This is the
      # check that catches undeclared runtime deps (e.g. the missing `click`
      # that made 0.3.0 crash on every command). See scripts/smoke_test.sh.
      - name: Smoke-test the PyPI wheel
        run: bash scripts/smoke_wheel.sh

      # Build the Docker image exactly as the release workflow does (single-arch
      # here for speed) and run the same pipeline against the baked-in binary.
      - name: Smoke-test the Docker image
        run: bash scripts/smoke_docker.sh

      - name: Scan the production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loafer:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
