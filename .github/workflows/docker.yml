name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only moves on real releases; dispatch builds are
          # traceable via the sha tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha

      - name: Resolve build version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            ref="${{ github.event.release.tag_name }}"
            version="${ref#v}"
          else
            # workflow_dispatch (or anything else): use the latest tag in
            # history, or a clearly-non-release local version if none exist.
            if tag=$(git describe --tags --abbrev=0 2>/dev/null); then
              version="${tag#v}"
            else
              version="0.0.0+manual"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      # Gate: build a single-arch (amd64) image, load it into the local docker,
      # and run a real pipeline against the baked-in binary before we push the
      # multi-arch image to GHCR. Catches a broken artifact (e.g. missing
      # runtime dep, broken entrypoint) before users can pull it. Reuses the
      # build cache, so the push step below mostly hits cache for amd64.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          platforms: linux/amd64
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LOAFER_ETL=${{ steps.version.outputs.version }}
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
          tags: loafer:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "${{ github.workspace }}/scripts:/harness:ro" \
            -e EXPECTED_VERSION="${EXPECTED_VERSION}" \
            loafer:smoke \
            -c '
              set -euo pipefail
              cp -r /harness/smoke /tmp/smoke
              cp /harness/smoke_test.sh /tmp/smoke_test.sh
              chmod +x /tmp/smoke_test.sh
              LOAFER=loafer /tmp/smoke_test.sh /tmp/smoke
            '

      - name: Scan the production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loafer:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LOAFER_ETL=${{ steps.version.outputs.version }}
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web:
    name: Build & Push Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha

      # Same gate as the engine image: prove the artifact serves before it is
      # pushed where someone can pin it.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.web
          load: true
          platforms: linux/amd64
          tags: loafer-web:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run -d --name loafer-web-smoke \
            --read-only --tmpfs /tmp:mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --user 10001:10001 \
            -e BETTER_AUTH_URL=https://smoke.invalid \
            -e BETTER_AUTH_SECRET=smoke-secret-not-used-for-anything-real \
            -e LOAFERD_URL=https://smoke.invalid:9443 \
            -e LOAFER_AUTH_EMAIL_ENDPOINT=https://smoke.invalid/send \
            -p 3000:3000 loafer-web:smoke
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "200" ]; then
              break
            fi
            sleep 2
          done
          for path in / /docs/introduction /changelog; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")
            echo "GET ${path} -> ${code}"
            [ "${code}" = "200" ]
          done
          docker rm -f loafer-web-smoke

      - name: Scan the production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loafer-web:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
