name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.3.1)"
        required: true
        type: string

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On manual runs, build the requested tag rather than the default
          # branch so a re-publish targets the exact released commit.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/unit/ -v

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          ref="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          version="${ref#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      # Pin the version explicitly. hatch-vcs derives the version from git, but
      # the test step above writes caches into the tree, marking it dirty and
      # producing a local version like 0.3.2.dev0+g<sha>.dYYYYMMDD that PyPI
      # rejects (400, local versions not allowed). Pinning from the release tag
      # — the same approach docker.yml uses — guarantees a clean release build.
      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LOAFER_ETL: ${{ steps.version.outputs.version }}
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token "${{ secrets.PYPI_API_TOKEN }}"
