# Multi-step transform pipeline (Phase 11).
#
# The `transform` is a list of steps. Each step's output feeds the next.
# Step types are auto-detected: a path ending in .py → custom, a string
# starting with SELECT → sql, any other string → an AI instruction.
#
# This example uses only local files and SQL — no API key required.
#
# Run it:
#   uv run loafer run examples/pipelines/multi_step_transform.yaml --verbose
#   uv run loafer validate examples/pipelines/multi_step_transform.yaml

name: Multi-step transform

source:
  path: examples/data/sample.csv

target:
  path: examples/output/multi_step.json

transform:
  - name: tag_active
    path: examples/transforms/tag_active.py
  - name: keep_active
    query: "SELECT id, name, email, score FROM {{source}} WHERE is_active = true"
  - name: rank
    query: "SELECT id, name, email, score FROM {{source}} ORDER BY score DESC"

mode: etl
chunk_size: 500
