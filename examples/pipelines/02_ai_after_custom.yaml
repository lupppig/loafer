# Custom Python runs first, then the AI transform sees its output.
# The AI is shown the custom code so it does not duplicate the region logic.
name: ai_after_custom

mode: etl

source:
  path: examples/data/orders.csv

transform:
  type: ai
  instruction: >-
    Lowercase and trim every email address, drop orders whose status is
    cancelled or refunded, and add an amount_usd column converting amount
    from its currency to USD (GBP 1.27, EUR 1.08, USD 1.0).
  custom_path: examples/transforms/tag_region.py
  custom_order: custom_first

target:
  path: examples/output/02_ai_after_custom.json
  write_mode: overwrite

llm:
  provider: claude
  model: claude-opus-5
  api_key: ${ANTHROPIC_API_KEY}
