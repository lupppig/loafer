name: Idempotent Orders Upsert
# Re-running this pipeline updates existing rows instead of duplicating them.
# Rows are matched on `order_id`; new keys are inserted, existing keys updated.
# Pairs well with incremental loading for repeatable scheduled syncs.
source:
  type: postgres
  url: ${SOURCE_DB_URL}
  query: SELECT order_id, status, total FROM orders

target:
  type: postgres
  url: ${TARGET_DB_URL}
  table: orders_synced
  write_mode: upsert
  key: order_id        # single column; use [a, b] for a composite key

transform:
  type: custom
  path: ./examples/transforms/sample_transform.py

mode: etl
