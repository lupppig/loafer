# Same two transforms, opposite order: AI first, then custom Python.
name: ai_before_custom

mode: etl

source:
  path: examples/data/orders.csv

transform:
  type: ai
  instruction: >-
    Lowercase and trim every email address, drop orders whose status is
    cancelled or refunded, and add an amount_usd column converting amount
    from its currency to USD (GBP 1.27, EUR 1.08, USD 1.0).
  custom_path: examples/transforms/tag_region.py
  custom_order: ai_first

target:
  path: examples/output/03_ai_before_custom.json
  write_mode: overwrite

llm:
  provider: claude
  model: claude-opus-5
  api_key: ${ANTHROPIC_API_KEY}
