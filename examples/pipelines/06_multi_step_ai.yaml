# Multi-step transform where one step is AI-generated and the others are
# custom Python and SQL. Each step feeds the next.
name: multi_step_ai

mode: etl

source:
  path: examples/data/orders.csv

transform:
  - name: tag_region
    type: custom
    path: examples/transforms/tag_region.py
  - name: normalize
    type: ai
    instruction: >-
      Lowercase and trim every email address, drop orders whose status is
      cancelled or refunded, and add an amount_usd column converting amount
      from its currency to USD (GBP 1.27, EUR 1.08, USD 1.0).
  - name: emea_only
    type: sql
    query: SELECT * FROM {{source}} WHERE region = 'EMEA'

target:
  path: examples/output/06_multi_step_ai.json
  write_mode: overwrite

llm:
  provider: claude
  model: claude-opus-5
  api_key: ${ANTHROPIC_API_KEY}
