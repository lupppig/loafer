name: Incremental SQLite Sync
# Only rows whose `seq` exceeds the last run's high-water mark are extracted.
# The watermark is saved to `incremental_sqlite.loafer-state.json` next to this file.
# Re-run to pull only new rows; pass --full-refresh to re-pull everything.
source:
  type: sqlite
  path: ./examples/data/events.db
  query: SELECT id, name, seq FROM events

target:
  type: json
  path: ./examples/output/events_incremental.json

transform:
  type: custom
  path: ./examples/transforms/sample_transform.py

mode: etl

incremental:
  column: seq
  initial: 0
