server_name: loafer-nats
http_port: 8222

jetstream {
  store_dir: "/data"
}

# One explicit application account keeps Loafer traffic out of the anonymous
# global account. Users share the JetStream namespace but can only perform the
# broker operations required by their process role.
accounts {
  LOAFER {
    jetstream: enabled
    users: [
      {
        user: "loafer-relay"
        password: $NATS_RELAY_PASSWORD
        permissions: {
          publish: [
            "loafer.jobs.*",
            "$JS.API.STREAM.INFO.LOAFER_JOBS",
            "$JS.API.STREAM.CREATE.LOAFER_JOBS",
            "$JS.API.STREAM.UPDATE.LOAFER_JOBS"
          ]
          subscribe: ["_INBOX.>"]
        }
      },
      {
        user: "loafer-etl"
        password: $NATS_ETL_PASSWORD
        permissions: {
          publish: [
            "$JS.API.STREAM.INFO.LOAFER_JOBS",
            "$JS.API.CONSUMER.CREATE.LOAFER_JOBS.loafer-etl.loafer.jobs.etl",
            "$JS.API.CONSUMER.DURABLE.CREATE.LOAFER_JOBS.loafer-etl",
            "$JS.API.CONSUMER.INFO.LOAFER_JOBS.loafer-etl",
            "$JS.API.CONSUMER.MSG.NEXT.LOAFER_JOBS.loafer-etl",
            "$JS.ACK.LOAFER_JOBS.loafer-etl.>"
          ]
          subscribe: ["loafer.jobs.etl", "_INBOX.>"]
        }
      },
      {
        user: "loafer-document"
        password: $NATS_DOCUMENT_PASSWORD
        permissions: {
          publish: [
            "$JS.API.STREAM.INFO.LOAFER_JOBS",
            "$JS.API.CONSUMER.CREATE.LOAFER_JOBS.loafer-document.loafer.jobs.document",
            "$JS.API.CONSUMER.DURABLE.CREATE.LOAFER_JOBS.loafer-document",
            "$JS.API.CONSUMER.INFO.LOAFER_JOBS.loafer-document",
            "$JS.API.CONSUMER.MSG.NEXT.LOAFER_JOBS.loafer-document",
            "$JS.ACK.LOAFER_JOBS.loafer-document.>"
          ]
          subscribe: ["loafer.jobs.document", "_INBOX.>"]
        }
      },
      {
        user: "loafer-browser"
        password: $NATS_BROWSER_PASSWORD
        permissions: {
          publish: [
            "$JS.API.STREAM.INFO.LOAFER_JOBS",
            "$JS.API.CONSUMER.CREATE.LOAFER_JOBS.loafer-browser.loafer.jobs.browser",
            "$JS.API.CONSUMER.DURABLE.CREATE.LOAFER_JOBS.loafer-browser",
            "$JS.API.CONSUMER.INFO.LOAFER_JOBS.loafer-browser",
            "$JS.API.CONSUMER.MSG.NEXT.LOAFER_JOBS.loafer-browser",
            "$JS.ACK.LOAFER_JOBS.loafer-browser.>"
          ]
          subscribe: ["loafer.jobs.browser", "_INBOX.>"]
        }
      }
    ]
  }
}
