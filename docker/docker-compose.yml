name: loafer

x-loafer-service: &loafer-service
  image: ${LOAFER_IMAGE:?set LOAFER_IMAGE to an immutable Loafer version or digest}
  env_file:
    - ../.env
  environment: &loafer-environment
    LOAFER_METADATA_URL: ${LOAFER_METADATA_URL:?set LOAFER_METADATA_URL}
    LOAFER_OBJECTS_PATH: /home/loafer/.loafer/objects
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true

services:
  postgres:
    image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loafer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-loafer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  metadata-migrate:
    <<: *loafer-service
    command: ["metadata", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-init:
    <<: *loafer-service
    user: "0:0"
    cap_add:
      - CHOWN
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/objects && chown -R 10001:10001 /data"]
    volumes:
      - type: volume
        source: loafer_data
        target: /data
        volume:
          nocopy: true
    restart: "no"

  loaferd:
    <<: *loafer-service
    # Also in the web profile: the browser boundary cannot serve without the
    # API it fronts, so selecting web brings loaferd with it.
    profiles: ["platform", "daemon", "web"]
    entrypoint: ["loaferd"]
    command: ["--behind-tls-proxy", "--host", "0.0.0.0", "--port", "9443"]
    environment:
      <<: *loafer-environment
      LOAFER_AUTH_ISSUER: ${LOAFER_AUTH_ISSUER:?set LOAFER_AUTH_ISSUER}
      LOAFER_AUTH_AUDIENCE: ${LOAFER_AUTH_AUDIENCE:?set LOAFER_AUTH_AUDIENCE}
      LOAFER_AUTH_JWKS_URL: ${LOAFER_AUTH_JWKS_URL:?set LOAFER_AUTH_JWKS_URL}
      LOAFER_ALLOWED_ORIGINS: ${LOAFER_ALLOWED_ORIGINS:?set LOAFER_ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:${LOAFERD_PORT:-9443}:9443"
    depends_on:
      metadata-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:9443/healthz',
          headers={'X-Forwarded-Proto': 'https', 'X-Forwarded-For': '127.0.0.1'});
          response = urllib.request.urlopen(request, timeout=2);
          assert response.status == 200 and json.load(response) == {'status': 'ok'}
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  # The browser-facing boundary: Next.js, Better Auth, and the BFF that forwards
  # a short-lived signed token to loaferd. It runs here rather than on a managed
  # edge because loaferd is reachable only on this private network, and because
  # session secrets belong on the operator's own infrastructure.
  web:
    image: ${LOAFER_WEB_IMAGE:?set LOAFER_WEB_IMAGE to an immutable Loafer web version or digest}
    profiles: ["platform", "web"]
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public HTTPS origin}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-${BETTER_AUTH_URL}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_DATABASE_URL: ${BETTER_AUTH_DATABASE_URL:?set BETTER_AUTH_DATABASE_URL}
      LOAFERD_URL: ${LOAFERD_INTERNAL_URL:-http://loaferd:9443}
      LOAFERD_AUDIENCE: ${LOAFER_AUTH_AUDIENCE:?set LOAFER_AUTH_AUDIENCE}
      # This hop stays inside the compose network; TLS is terminated by the
      # operator's reverse proxy in front of the published port below.
      LOAFERD_TRUST_INTERNAL_NETWORK: "1"
      LOAFER_AUTH_EMAIL_ENDPOINT: ${LOAFER_AUTH_EMAIL_ENDPOINT:?set LOAFER_AUTH_EMAIL_ENDPOINT}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    ports:
      - "127.0.0.1:${LOAFER_WEB_PORT:-3000}:3000"
    depends_on:
      metadata-migrate:
        condition: service_completed_successfully
      loaferd:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

  scheduler:
    <<: *loafer-service
    profiles: ["platform", "scheduler"]
    command: ["start"]
    volumes:
      - type: volume
        source: loafer_data
        target: /home/loafer/.loafer
        volume:
          nocopy: true
    depends_on:
      metadata-migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *loafer-service
    profiles: ["platform", "worker"]
    command: ["worker"]
    volumes:
      - type: volume
        source: loafer_data
        target: /home/loafer/.loafer
        volume:
          nocopy: true
    depends_on:
      metadata-migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
  loafer_data:
